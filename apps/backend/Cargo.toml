[package]
name = "quant-backend"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[dependencies]
async-trait = "0.1"
axum = "0.8"
backtest-core = { path = "../../crates/backtest-core" }
csv = "1"
futures-util = "0.3"
identity = { path = "../../crates/identity" }
market-data = { path = "../../crates/market-data" }
lapin = "2.5"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "macros", "migrate", "uuid", "rust_decimal"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4", "serde"] }