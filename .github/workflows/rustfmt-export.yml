name: Rustfmt Backtest V2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and commit Rust sources
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/backtest-core/src
            git commit -m "style(backtest): format portfolio V2 sources"
            git push origin "HEAD:$GITHUB_HEAD_REF"
          fi
