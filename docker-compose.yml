services:
  postgres:
    image: postgres:17-alpine
    container_name: rust-quant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rust_quant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - rust_quant_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rust_quant"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    container_name: rust-quant-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - rust_quant_prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  grafana:
    image: grafana/grafana:latest
    container_name: rust-quant-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - rust_quant_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: rust-quant-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: rust_quant
      RABBITMQ_DEFAULT_PASS: rust_quant_dev
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rust_quant_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  rust_quant_postgres_data:
  rust_quant_rabbitmq_data:
  rust_quant_prometheus_data:
  rust_quant_grafana_data:
