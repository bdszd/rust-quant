[package]
name = "identity"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "uuid",
    "chrono",
] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }