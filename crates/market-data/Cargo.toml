[package]
name = "market-data"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
csv = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "macros", "migrate", "rust_decimal"] }
thiserror = "2"
